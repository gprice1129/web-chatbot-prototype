services:
  app:
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      FILES_BASE_PATH: ${FILES_BASE_PATH}
      COOKIE_KEY: ${COOKIE_KEY}
      APP_ENV: ${APP_ENV:-production}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${APP_DB_USER}
      PGPASSWORD: ${APP_DB_PASSWORD}
      PGDATABASE: ${APP_DB_NAME}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - 3000
    healthcheck:
      # Goes green only after make_file_parse_service() has finished its
      # pg-boss bootstrap (run_PgBoss + createQueue) -- those run before
      # app.listen() in main.ts, so a 200 from /health implies they're done.
      # The parser depends on this so its own pg-boss start does not race
      # the webserver's DDL.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - uploads:${FILES_BASE_PATH}
  parser:
    environment:
      FILES_BASE_PATH: ${FILES_BASE_PATH}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${APP_DB_USER}
      PGPASSWORD: ${APP_DB_PASSWORD}
      PGDATABASE: ${APP_DB_NAME}
    build:
      context: .
      dockerfile: Dockerfile
      target: parser
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - uploads:${FILES_BASE_PATH}
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
      args:
        FE_PACKAGE: aim_hi_fe
        FE_DIST_DIR: dist
    container_name: nginx-gateway
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: ${SERVER_NAME}
      SSL_CERT_FILE: ${SSL_CERT_FILE}
      SSL_KEY_FILE: ${SSL_KEY_FILE}
    volumes:
      - ./config/nginx/certs:/etc/nginx/certs:ro
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${APP_DB_NAME}"]
      interval: 2s
      timeout: 5s
      retries: 30
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      APP_DB_NAME: ${APP_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/db/bootstrap.sh:/docker-entrypoint-initdb.d/10_bootstrap.sh:ro
      - ./config/db/seed.sh:/docker-entrypoint-initdb.d/20_seed.sh:ro
      - ./config/db/migrations:/migrations:ro
      - ./config/db/seed:/seed:ro

volumes:
  postgres_data:
  uploads:
