services:
  app:
    restart: unless-stopped
    environment:
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
      ANTHROPIC_BASE_URL_API_KEY_FILE: /run/secrets/anthropic_api_key
      FILES_BASE_PATH: ${FILES_BASE_PATH}
      COOKIE_KEY_FILE: /run/secrets/cookie_key
      APP_ENV: ${APP_ENV:-production}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-5}
      RATE_LIMIT_LOGIN_WINDOW: "${RATE_LIMIT_LOGIN_WINDOW:-1 minute}"
      RATE_LIMIT_ALLY_MAX: ${RATE_LIMIT_ALLY_MAX:-30}
      RATE_LIMIT_ALLY_WINDOW: "${RATE_LIMIT_ALLY_WINDOW:-1 minute}"
      RATE_LIMIT_GRANT_REVIEW_MAX: ${RATE_LIMIT_GRANT_REVIEW_MAX:-10}
      RATE_LIMIT_GRANT_REVIEW_WINDOW: "${RATE_LIMIT_GRANT_REVIEW_WINDOW:-1 hour}"
      LOGIN_USERNAME_MAX_LENGTH: ${LOGIN_USERNAME_MAX_LENGTH:-64}
      LOGIN_PASSWORD_MAX_LENGTH: ${LOGIN_PASSWORD_MAX_LENGTH:-256}
      LOGIN_BODY_LIMIT: ${LOGIN_BODY_LIMIT:-4096}
      # Model generation parameters; blank keeps the app's profile defaults.
      MODEL_ALLY_EFFORT: ${MODEL_ALLY_EFFORT:-}
      MODEL_ALLY_THINKING: ${MODEL_ALLY_THINKING:-}
      MODEL_ALLY_CACHING: ${MODEL_ALLY_CACHING:-}
      MODEL_ALLY_MAX_TOKENS: ${MODEL_ALLY_MAX_TOKENS:-}
      MODEL_GRANT_REVIEW_EFFORT: ${MODEL_GRANT_REVIEW_EFFORT:-}
      MODEL_GRANT_REVIEW_THINKING: ${MODEL_GRANT_REVIEW_THINKING:-}
      MODEL_GRANT_REVIEW_CACHING: ${MODEL_GRANT_REVIEW_CACHING:-}
      MODEL_GRANT_REVIEW_MAX_TOKENS: ${MODEL_GRANT_REVIEW_MAX_TOKENS:-}
      MODEL_SUMMARY_EFFORT: ${MODEL_SUMMARY_EFFORT:-}
      MODEL_SUMMARY_THINKING: ${MODEL_SUMMARY_THINKING:-}
      MODEL_SUMMARY_CACHING: ${MODEL_SUMMARY_CACHING:-}
      MODEL_SUMMARY_MAX_TOKENS: ${MODEL_SUMMARY_MAX_TOKENS:-}
      EMBEDDER_BASE_URL: ${EMBEDDER_BASE_URL:-http://embedder:80}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${APP_DB_USER}
      PGPASSWORD_FILE: /run/secrets/app_db_password
      PGDATABASE: ${APP_DB_NAME}
    secrets:
      - anthropic_api_key
      - cookie_key
      - app_db_password
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        FILES_BASE_PATH: ${FILES_BASE_PATH}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - uploads:${FILES_BASE_PATH}
    mem_limit: 768m
    cpus: "1.0"

  parser:
    restart: unless-stopped
    environment:
      FILES_BASE_PATH: ${FILES_BASE_PATH}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${APP_DB_USER}
      PGPASSWORD_FILE: /run/secrets/app_db_password
      PGDATABASE: ${APP_DB_NAME}
    secrets:
      - app_db_password
    build:
      context: .
      dockerfile: Dockerfile
      target: parser
      args:
        FILES_BASE_PATH: ${FILES_BASE_PATH}
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - uploads:${FILES_BASE_PATH}
    mem_limit: 512m
    cpus: "0.75"

  # Self-hosted embedding server.
  # Text that is embedded never leaves the compose network including chat
  # content and uploaded documents.
  #
  # Deliberately has no healthcheck because the TEI runtime image does not ship
  # with an HTTP client.
  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    restart: unless-stopped
    command:
      - "--model-id"
      - "${EMBEDDER_MODEL:-BAAI/bge-large-en-v1.5}"
      - "--port"
      - "80"
      # Token budget for one inference batch. TEI allocates against this during
      # warmup, so it sets peak memory at load. The server default (16384) sizes
      # activation buffers for a GPU and is pure waste on CPU.
      #
      # 4096 is not arbitrary: it is the largest batch this deployment can
      # actually form. The CPU backend caps batches at 8 requests and
      # bge-large's context is 512 tokens. 8 x 512 = 4096 is the ceiling.
      #
      # Do not go below the model's context length. With --auto-truncate off,
      # TEI refuses to start when max_input_length exceeds max-batch-tokens. A
      # longer-context model needs this raised to match.
      - "--max-batch-tokens"
      - "${EMBEDDER_MAX_BATCH_TOKENS:-4096}"
    expose:
      - 80
    volumes:
      # Weights are downloaded on first boot (~1.3GB for the default model);
      # without this they are re-fetched every time the container is recreated.
      - embedder_models:/data
    # Must comfortably exceed the fp32 weights (~1.3GB for bge-large), because
    # TEI peaks near double that while materializing tensors during load.
    mem_limit: 4g
    cpus: "4.0"

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
      args:
        FE_PACKAGE: aim_hi_fe
        FE_DIST_DIR: dist
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    environment:
      SERVER_NAME: ${SERVER_NAME}

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${APP_DB_NAME}"]
      interval: 2s
      timeout: 5s
      retries: 30
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD_FILE: /run/secrets/app_db_password
      APP_DB_NAME: ${APP_DB_NAME}
    secrets:
      - postgres_password
      - app_db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/db/bootstrap.sh:/docker-entrypoint-initdb.d/10_bootstrap.sh:ro
    mem_limit: 768m
    cpus: "1.0"

  # One-shot migration runner for applying SQL migrations
  migrate:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${APP_DB_USER}
      PGPASSWORD_FILE: /run/secrets/app_db_password
      PGDATABASE: ${APP_DB_NAME}
      # Used only for the CREATE EXTENSION pre-step in migrate.sh.
      POSTGRES_SUPERUSER: ${POSTGRES_USER}
      POSTGRES_SUPERUSER_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - app_db_password
      - postgres_password
    entrypoint: ["/bin/bash", "/migrate.sh"]
    volumes:
      - ./config/db/migrate.sh:/migrate.sh:ro
      - ./config/db/migrations:/migrations:ro
      - ./config/db/seed:/seed:ro
    mem_limit: 256m
    cpus: "0.5"

volumes:
  postgres_data:
  uploads:
  embedder_models:

# Secrets are read from files on the host (kept out of git and out of images)
# and mounted into the containers at /run/secrets/<name>. Generate them with
# scripts/gen_secrets.sh. Override the location with SECRETS_DIR (e.g. point it
# at /etc/aim-hi/secrets on the server).
secrets:
  postgres_password:
    file: ${SECRETS_DIR:-./secrets}/postgres_password
  app_db_password:
    file: ${SECRETS_DIR:-./secrets}/app_db_password
  cookie_key:
    file: ${SECRETS_DIR:-./secrets}/cookie_key
  anthropic_api_key:
    file: ${SECRETS_DIR:-./secrets}/anthropic_api_key
