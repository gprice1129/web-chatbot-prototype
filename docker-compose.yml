services:
  app:
    restart: unless-stopped
    environment:
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
      ANTHROPIC_BASE_URL_API_KEY: ${ANTHROPIC_BASE_URL_API_KEY}
      FILES_BASE_PATH: ${FILES_BASE_PATH}
      COOKIE_KEY: ${COOKIE_KEY}
      APP_ENV: ${APP_ENV:-production}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${APP_DB_USER}
      PGPASSWORD: ${APP_DB_PASSWORD}
      PGDATABASE: ${APP_DB_NAME}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - uploads:${FILES_BASE_PATH}
    mem_limit: 768m
    cpus: "1.0"

  parser:
    restart: unless-stopped
    environment:
      FILES_BASE_PATH: ${FILES_BASE_PATH}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${APP_DB_USER}
      PGPASSWORD: ${APP_DB_PASSWORD}
      PGDATABASE: ${APP_DB_NAME}
    build:
      context: .
      dockerfile: Dockerfile
      target: parser
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - uploads:${FILES_BASE_PATH}
    mem_limit: 512m
    cpus: "0.75"

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
      args:
        FE_PACKAGE: aim_hi_fe
        FE_DIST_DIR: dist
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    environment:
      SERVER_NAME: ${SERVER_NAME}

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${APP_DB_NAME}"]
      interval: 2s
      timeout: 5s
      retries: 30
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      APP_DB_NAME: ${APP_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/db/bootstrap.sh:/docker-entrypoint-initdb.d/10_bootstrap.sh:ro
      - ./config/db/seed.sh:/docker-entrypoint-initdb.d/20_seed.sh:ro
      - ./config/db/migrations:/migrations:ro
      - ./config/db/seed:/seed:ro
    mem_limit: 768m
    cpus: "1.0"

volumes:
  postgres_data:
  uploads:
